<!-- File: modules/billing/templates/container_ready.html -->
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Container Siap Digunakan</title></head>
<body style="font-family: sans-serif; background-color: #f8fafc; padding: 24px; color: #1e293b;">
  <div style="max-width: 560px; margin: auto; background: #ffffff; padding: 32px; border-radius: 12px; border: 1px solid #e2e8f0;">
    <h2 style="color: #0f172a; margin-top: 0;">🚀 Container Anda Telah Siap!</h2>
    <p>Halo <strong>{{.Name}}</strong>,</p>
    <p>Container Docker Anda telah berhasil di-deploy dan siap digunakan.</p>
    <div style="background: #f1f5f9; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 13px; margin: 20px 0;">
      <div><strong>Nama Container:</strong> {{.ContainerName}}</div>
      <div><strong>Image:</strong> {{.Image}}</div>
      <div><strong>SSH Port:</strong> {{.SSHPort}}</div>
      <div><strong>HTTP Port:</strong> {{.HTTPPort}}</div>
    </div>
    <div style="margin: 24px 0;">
      <a href="{{.TerminalURL}}" style="background: #0284c7; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block;">Buka Web Terminal</a>
    </div>
    <p style="font-size: 12px; color: #64748b; margin-top: 32px; border-top: 1px solid #e2e8f0; padding-top: 16px;">
      Teracloud Cloud Hosting Platform &bull; No Reply
    </p>
  </div>
</body>
</html>
