<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:24px;font-family:system-ui,sans-serif;background-color:#ffffff;color:#1a2e2b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">
          <tr>
            <td style="padding:32px 0 16px;">
              <span style="font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#1a2e2b;">{{.AppName}}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;background-color:#ffffff;border-radius:12px;border:1px solid #e2e8e4;">
              <h1 style="margin:0 0 8px;font-size:20px;font-weight:600;line-height:1.3;color:#1a2e2b;">{{.Title}}</h1>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#6b7f7a;">{{.Body}}</p>
              {{if .ActionURL}}
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
                <tr>
                  <td align="center" style="border-radius:8px;" bgcolor="#22B396">
                    <a href="{{.ActionURL}}" target="_blank" style="display:inline-block;padding:12px 28px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;letter-spacing:0.01em;">
                      {{.ActionLabel}}
                    </a>
                  </td>
                </tr>
              </table>
              {{end}}
              {{if .Extra}}
              <p style="margin:16px 0 0;font-size:13px;line-height:1.5;color:#6b7f7a;">{{.Extra}}</p>
              {{end}}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 0 32px;border-top:1px solid #e2e8e4;margin-top:24px;">
              <p style="margin:0;font-size:12px;color:#9aa9a4;">
                {{.AppName}} &mdash; <a href="https://{{.Domain}}" style="color:#22B396;text-decoration:none;">{{.Domain}}</a>
              </p>
              <p style="margin:8px 0 0;font-size:11px;color:#bcc9c4;">
                Jika kamu tidak meminta email ini, abaikan saja.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
